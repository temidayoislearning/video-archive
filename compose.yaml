services:
  archive:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ARCHIVE_PASSWORD: "${ARCHIVE_PASSWORD:?Set ARCHIVE_PASSWORD in your shell or .env file}"
      ARCHIVE_PUBLIC_ORIGIN: "${ARCHIVE_PUBLIC_ORIGIN:-http://127.0.0.1:8000}"
    volumes:
      - archive_data:/data
    restart: unless-stopped
volumes:
  archive_data:
